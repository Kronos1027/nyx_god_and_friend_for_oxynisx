name: CI

on:
  push:
    branches: [main, nyx-2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do núcleo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-core.txt -r requirements-security.txt

      - name: Lint (ruff)
        run: ruff check src tests tools bench

      - name: Testes (pytest)
        run: python -m pytest tests/ -m 'not windows_live' --tb=short

      - name: Segredos (offline, sem validação de credenciais na rede)
        env:
          PRE_COMMIT_HOME: ${{ github.workspace }}/.local-deps/pre-commit-cache
          PIP_CACHE_DIR: ${{ github.workspace }}/.local-deps/pip-cache
        run: python -m pre_commit run --all-files --show-diff-on-failure
