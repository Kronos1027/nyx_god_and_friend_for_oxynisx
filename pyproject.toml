[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["windows_live: real Windows/Chromium fixtures; explicit opt-in and independent of unit doubles"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default (E4, E7, E9, F) + bugs comuns
select = ["E", "F", "W", "B"]
ignore = ["E501"]
