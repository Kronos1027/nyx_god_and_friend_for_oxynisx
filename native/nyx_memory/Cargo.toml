[package]
name = "nyx-memory-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "nyx_memory_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.0", features = ["abi3-py311"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
